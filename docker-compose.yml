version: '3.8'

services:
  # Main Morse Chat Server
  # Uses the OCI image built by the Forgejo Actions workflow on code.spiegie.de
  # (nix build .#dockerImage, pushed on every push to main).
  # Requires `podman login code.spiegie.de -u spiegie` once (read:package token).
  morse-server:
    image: code.spiegie.de/spiegie/morse-relay:latest
    pull_policy: always
    container_name: morse-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Set ADMIN_TOKEN in your shell or a .env file to enable admin features.
      # Passed via env (not CLI) so it doesn't show up in `docker inspect`.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    ports:
      # Localhost only: the backend must not be reachable from the web.
      # Public traffic goes through nginx (production profile) on 80/443,
      # which reaches this service over the internal compose network.
      - "127.0.0.1:7002:7002"   # WebSocket + HTTP health (local only)
    # The registry image already sets the entrypoint (node + tsx + morse-relais.ts);
    # only the server args are overridden here.
    command: ["server", "--port", "7002", "--name", "server-1"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No healthcheck override: the registry image ships its own (node fetch /health);
    # the nix image has no wget.

  # Optional: Nginx reverse proxy with TLS
  nginx:
    image: nginx:alpine
    container_name: morse-nginx
    restart: unless-stopped
    depends_on:
      - morse-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./dist:/usr/share/nginx/html:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - production

  # Optional: Vite dev server for development
  morse-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: morse-chat:dev
    container_name: morse-dev
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"   # Vite dev server
    entrypoint: ["npx", "vite"]
    command: ["dev", "--host", "0.0.0.0", "--port", "3000"]
    profiles:
      - development
    volumes:
      - .:/app
      - /app/node_modules

networks:
  default:
    name: morse-network
    driver: bridge
